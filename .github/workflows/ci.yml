name: CI

# SEC-15: lint, typecheck, unit tests, accessibility, SAST, dependency and
# container scanning, SBOM. Third-party actions are pinned to commit SHAs
# (ADR-0019). All data in CI is synthetic (SCL-12).

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  PRODUCT_NAME: Common Ground

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:product-name
      - run: pnpm test
      - name: Public help page builds inside its first-load budget (PUB-07)
        run: pnpm --filter @cg/web-help build && pnpm --filter @cg/web-help check:size
      - name: Requirements index is up to date
        run: pnpm reqindex && git diff --exit-code -- docs/requirements-index.md

  stack:
    name: Compose stack, integration and accessibility tests
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/init-env.sh
      - name: One runner address sends every suite and the load smoke; the per-address flood limit (SEC-17) is unit-tested, so it is raised here
        run: echo "PUBLIC_IP_DENY_PER_10MIN=100000" >> .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 600
      - name: Show status on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 150 migrate seed-load api worker
      - run: pnpm test:integration
      - name: Public API, channels, worker filing, staff review, partner sharing, the needs board, public information, resident updates, referrals, reminders, the field roster, missions, check-ins, positions, safety alerts, hazards, field messages, F09 reminders, badges and net-control comms against the compose database (AC-11B, INT-20, RULE-17, PHO-15, CHN-03/05, FR-12, G4, NED-02/04/05/07, AC-17B/C, CON-08/15, PUB-01–06/08–11/13/16–18, CNT-01, FL-10/11, F09, AC-16B, DSP-02/08/09, PER-01/02, FLD-03/04, MIS-01–04, CALL-01, AC-02A/B/C, AC-05A/B, AC-06A/B/C/D, AC-07A/C, DSP-04/05/07, FLD-02/14/16, HAZ-01, FR-04, AC-04A/B/C, DSP-06/10/11, FR-17.05, REM-01, FR-09, AC-09A/B/C, BDG-01/02, FR-13, AC-13A/B/C, RULE-11, FLD-17, SEC-13)
        run: |
          set -a; . ./.env; set +a
          export API_DB_TEST_APP_URL="postgres://cg_app:${CG_APP_PASSWORD}@127.0.0.1:5432/cg"
          export API_DB_TEST_WORKER_URL="postgres://cg_worker:${CG_WORKER_PASSWORD}@127.0.0.1:5432/cg"
          # One database for every suite: run the files one after another (a sweep or a photo job in one file touches rows another file is mid-way through).
          pnpm vitest run --project unit --no-file-parallelism services/api/test/public.db.test.ts services/api/test/channels.db.test.ts services/api/test/reports.db.test.ts services/api/test/sharing.db.test.ts services/api/test/needs.db.test.ts services/api/test/help.db.test.ts services/api/test/updates.db.test.ts services/api/test/roster.db.test.ts services/api/test/missions.db.test.ts services/api/test/field.db.test.ts services/api/test/fieldops.db.test.ts services/worker/test/intake.db.test.ts services/worker/test/reminders.db.test.ts
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Load smoke profiles through the k6 container (SCL-03)
        run: |
          tests/load/run.sh submissions smoke
          tests/load/run.sh sms-sessions smoke
          tests/load/run.sh help smoke
      - name: Migration drill on the compose database, last so nothing depends on the state it leaves (SEC-05, SEC-11)
        run: |
          set -a; . ./.env; set +a
          # The newest migrations down and up again; no undocumented or stale dictionary column; RLS forced on every tenant table and partition.
          DATABASE_MIGRATOR_URL="postgres://cg_migrator:${CG_MIGRATOR_PASSWORD}@127.0.0.1:5432/cg" pnpm --filter @cg/db check:migrations 2
      - name: Show the worker and API logs when a test step failed
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 120 migrate seed-load && docker compose logs --no-color --tail 300 worker api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - run: docker compose down -v
        if: always()

  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.178.0
      - run: semgrep scan --config p/default --config p/typescript --config p/owasp-top-ten --error --exclude docs --exclude mockups

  supply-chain:
    name: Dependency, secret and container scans; SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Trivy filesystem scan (dependencies, secrets, IaC)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - run: scripts/init-env.sh
      - run: docker compose build api web
      - name: Trivy image scan (api)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: common-ground/api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      # Our layers and the Alpine packages gate the build. The upstream Caddy
      # binary is scanned separately and reported only: every Caddy release
      # lags its Go libraries by weeks, so a blocking gate on it would be red
      # at all times; bumping the pinned Caddy release is the fix (README).
      - name: Trivy image scan (web)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: common-ground/web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-files: /usr/bin/caddy
      - name: Upstream Caddy binary findings (report only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: common-ground/web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: SBOM (SPDX) per image
        uses: anchore/sbom-action@7b36ad622f042cab6f59a75c2ac24ccb256e9b45 # v0.20.4
        with:
          image: common-ground/api:local
          artifact-name: sbom-api.spdx.json
