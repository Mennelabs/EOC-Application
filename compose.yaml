# Common Ground local stack: `docker compose up` (SCL-11).
# Run scripts/init-env.sh (or scripts/init-env.ps1 on Windows) once first; it
# writes .env with random local secrets.
# Synthetic data only on this stack (SCL-12).
name: common-ground

include:
  - compose.cjis.yaml # CJIS enclave on its own network (SEC-12, ADR-0021, ADR-0036–0038)

x-node-env: &node-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PRODUCT_NAME: ${PRODUCT_NAME:?run scripts/init-env.sh first}
  DATA_CLASSIFICATION_MODE: synthetic
  PORT: '8080'
  DATABASE_URL: postgres://cg_app:${CG_APP_PASSWORD:?}@db:5432/cg
  AMQP_URL: amqp://cg:${RABBITMQ_PASSWORD:?}@queue:5672
  S3_ENDPOINT: http://objects:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: cg-local
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  S3_BUCKET: cg-local
  # Issued official reports and audit anchors, under object lock (ADR-0010, RULE-10).
  S3_RECORDS_BUCKET: cg-local-records
  S3_LOCK_MODE: COMPLIANCE
  # Browsers upload photos straight to object storage through the gateway's objects host (SCL-04).
  S3_PUBLIC_ENDPOINT: https://objects.${GATEWAY_HOST:-localhost}
  KEYS_PROVIDER: openbao
  OPENBAO_ADDR: http://keys:8200
  OPENBAO_TOKEN_FILE: /bao-init/app-token
  IDP_INTERNAL_BASE: http://idp:8080/auth
  IDP_PUBLIC_BASE: https://${GATEWAY_HOST:-localhost}/auth
  IDP_HEALTH_URL: http://idp:9000/auth/health/ready
  SMTP_URL: smtp://mail:1025
  RESIDENT_TOKEN_SECRET: ${RESIDENT_TOKEN_SECRET:?}
  # Optional real texting (docs/06); empty keeps the simulator.
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  WEBHOOK_PUBLIC_BASE: ${WEBHOOK_PUBLIC_BASE:-}
  # Address suggestions from the self-hosted geocoder when the maps profile runs (BRD:FR-03.02):
  # set GEOCODER_URL=http://geocoder:8080; empty means the county's parcels only.
  GEOCODER_URL: ${GEOCODER_URL:-}
  # Abuse protection per address (SEC-17); raise the deny limit only for a load generator on one host.
  PUBLIC_IP_VERIFY_PER_10MIN: ${PUBLIC_IP_VERIFY_PER_10MIN:-20}
  PUBLIC_IP_DENY_PER_10MIN: ${PUBLIC_IP_DENY_PER_10MIN:-120}
  # Where browsers reach the CJIS enclave; the console only links there (SEC-12, ADR-0038).
  CJIS_PUBLIC_URL: https://${GATEWAY_HOST:-localhost}:${CJIS_HTTPS_PORT:-8443}
  # AI features (ADR-0043): OpenAI for every function. Without a key they stay off.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_ORGANIZATION: ${OPENAI_ORGANIZATION:-}
  AI_MODEL_TEXT: ${AI_MODEL_TEXT:-}
  AI_MODEL_VISION: ${AI_MODEL_VISION:-}
  AI_MODEL_CLASSIFIER: ${AI_MODEL_CLASSIFIER:-}
  AI_MODEL_TRANSCRIPTION: ${AI_MODEL_TRANSCRIPTION:-}
  AI_MODEL_SPEECH: ${AI_MODEL_SPEECH:-}

x-node-health: &node-health
  test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health/ready']
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  gateway:
    image: caddy:2.11.4-alpine
    environment:
      GATEWAY_HOST: ${GATEWAY_HOST:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - tiles:/srv/tiles:ro
    ports:
      - '${GATEWAY_HTTPS_PORT:-443}:443'
      - '${GATEWAY_HTTP_PORT:-80}:80'
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_started }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8088/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [platform]

  web:
    build: { context: ., dockerfile: infra/web/Dockerfile }
    image: common-ground/web:local
    environment:
      PRODUCT_NAME: ${PRODUCT_NAME:?}
      COUNTY_NAME: ${COUNTY_NAME:-Westwind County}
      HELP_PHONE: ${HELP_PHONE:-(314) 555-0142}
      # The root address forwards to this tenant and event (the exercise locally).
      DEFAULT_TENANT: ${DEFAULT_TENANT:-county}
      DEFAULT_EVENT: ${DEFAULT_EVENT:-westwind}
    networks: [platform]

  api:
    build: { context: ., dockerfile: infra/node/Dockerfile, args: { APP: services/api } }
    image: common-ground/api:local
    # SCL-06: a crash (a dependency gone mid-call) restarts the process; state is in the database.
    restart: unless-stopped
    environment: *node-env
    volumes:
      - keys_init:/bao-init:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      queue: { condition: service_healthy }
      objects: { condition: service_healthy }
      keys-init: { condition: service_completed_successfully }
    healthcheck: *node-health
    networks: [platform]

  worker:
    build: { context: ., dockerfile: infra/node/Dockerfile, args: { APP: services/worker } }
    image: common-ground/worker:local
    # SCL-06: a crash (a dependency gone mid-call) restarts the process; state is in the database.
    restart: unless-stopped
    environment:
      <<: *node-env
      DATABASE_URL: postgres://cg_worker:${CG_WORKER_PASSWORD:?}@db:5432/cg
      KC_ADMIN_USER: cg-admin
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      GATEWAY_PUBLIC_URL: https://${GATEWAY_HOST:-localhost}
      MAIL_FROM: no-reply@${GATEWAY_HOST:-localhost}
      IDP_DEV_DIRECT_GRANT: ${IDP_DEV_DIRECT_GRANT:-true}
      # Reference data (ADR-0039): recorded synthetic WESTWIND responses unless set to `live`,
      # which calls the free federal sources (only geography leaves; SCL-12).
      REFDATA_MODE: ${REFDATA_MODE:-recorded}
      REFDATA_ALLOWED_HOSTS: ${REFDATA_ALLOWED_HOSTS:-}
      REFDATA_CONTACT: ${REFDATA_CONTACT:-}
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      # FLD-13: offline map packages per area are cut from the regional tiles when they exist.
      MAP_TILES_PATH: /srv/tiles/region.pmtiles
      MAP_EXERCISE: ${MAP_EXERCISE:-true}
    volumes:
      - keys_init:/bao-init:ro
      - tiles:/srv/tiles:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      # The exercise county is loaded before the worker starts consuming the
      # outbox; it also keeps `up --wait` from treating the finished loader as
      # a failure (one-shots need a dependant, docker/compose#10596).
      seed-load: { condition: service_completed_successfully }
      queue: { condition: service_healthy }
      idp: { condition: service_healthy }
      objects: { condition: service_healthy }
    healthcheck: *node-health
    networks: [platform]

  migrate:
    build: { context: ., dockerfile: infra/node/Dockerfile, args: { APP: packages/db } }
    image: common-ground/migrate:local
    environment:
      ENTRY: migrate.ts
      DATABASE_MIGRATOR_URL: postgres://cg_migrator:${CG_MIGRATOR_PASSWORD:?}@db:5432/cg
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
    networks: [platform]

  seed:
    build: { context: ., dockerfile: infra/node/Dockerfile, args: { APP: tools/seed } }
    image: common-ground/seed:local
    environment:
      ENTRY: cli.ts
    command: ['sh', '-c', 'exec node tools/seed/src/cli.ts --out /data/seed']
    volumes:
      - seed_data:/data/seed
    restart: 'no'
    networks: [platform]

  # Loads the synthetic WESTWIND county (tenants, template roles, cast accounts)
  # and hands provisioning to the worker. Re-runs are no-ops (SCL-12).
  seed-load:
    build: { context: ., dockerfile: infra/node/Dockerfile, args: { APP: tools/seed } }
    image: common-ground/seed:local
    environment:
      ENTRY: load.ts
      DATABASE_URL: postgres://cg_worker:${CG_WORKER_PASSWORD:?}@db:5432/cg
      # Opt-in: that many reviewed synthetic damage reports in the exercise event (layer 6).
      SEED_DAMAGE_REPORTS: ${SEED_DAMAGE_REPORTS:-0}
    depends_on:
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
    restart: 'no'
    networks: [platform]

  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CG_MIGRATOR_PASSWORD: ${CG_MIGRATOR_PASSWORD:?}
      CG_APP_PASSWORD: ${CG_APP_PASSWORD:?}
      CG_WORKER_PASSWORD: ${CG_WORKER_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d cg']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  queue:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cg
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - queue_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:${QUEUE_UI_PORT:-15672}:15672'
      - '127.0.0.1:${QUEUE_PORT:-5672}:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [platform]

  objects:
    build: { context: infra/minio }
    image: common-ground/minio:local
    environment:
      MINIO_ROOT_USER: cg-local
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Direct browser uploads (SCL-04): only the resident app's origin may call the object API.
      MINIO_API_CORS_ALLOW_ORIGIN: https://${GATEWAY_HOST:-localhost}
    volumes:
      - objects_data:/data
    ports:
      - '127.0.0.1:${OBJECTS_UI_PORT:-9001}:9001'
      - '127.0.0.1:${OBJECTS_PORT:-9000}:9000'
    networks: [platform]

  keys:
    image: openbao/openbao:2.1.0
    command: ['server', '-config=/etc/openbao/cg.hcl']
    volumes:
      - ./infra/openbao/config.hcl:/etc/openbao/cg.hcl:ro
      - keys_data:/openbao/file
    ports:
      - '127.0.0.1:${KEYS_PORT:-8200}:8200'
    healthcheck:
      # Healthy once the server answers; it starts sealed and keys-init unseals it.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8200/v1/sys/seal-status']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  keys-init:
    image: openbao/openbao:2.1.0
    entrypoint: ['/bin/sh', '/init.sh']
    environment:
      BAO_ADDR: http://keys:8200
    volumes:
      - ./infra/openbao/init.sh:/init.sh:ro
      - keys_init:/bao-init
    depends_on:
      keys: { condition: service_healthy }
    restart: 'no'
    networks: [platform]

  idp:
    image: keycloak/keycloak:26.0.7
    command:
      - start
      - --http-enabled=true
      # Public URL for every realm (issuer, email links); the worker's admin
      # calls stay on the internal address thanks to the dynamic backchannel.
      - --hostname=https://${GATEWAY_HOST:-localhost}/auth
      - --hostname-backchannel-dynamic=true
      - --proxy-headers=xforwarded
      - --http-relative-path=/auth
      - --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: cg-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    depends_on:
      db: { condition: service_healthy }
    ports:
      - '127.0.0.1:${IDP_PORT:-8081}:8080'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [platform]

  mail:
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:${MAIL_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [platform]

  # --- Maps (SCL-13). Opt in with COMPOSE_PROFILES=maps (geocoder) and run the
  # one-shot tile build once: `docker compose --profile maps-build run --rm tiles-build`.
  geocoder:
    profiles: [maps]
    image: mediagis/nominatim:4.5
    environment:
      PBF_URL: ${OSM_PBF_URL:-https://download.geofabrik.de/north-america/us/missouri-latest.osm.pbf}
      REPLICATION_URL: ''
      IMPORT_STYLE: address
      NOMINATIM_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - geocoder_data:/var/lib/postgresql/16/main
    shm_size: 1g
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/status']
      interval: 30s
      timeout: 5s
      retries: 240
      start_period: 10m
    networks: [platform]

  tiles-build:
    profiles: [maps-build]
    image: eclipse-temurin:21-jre-alpine
    working_dir: /work
    environment:
      OSM_PBF_URL: ${OSM_PBF_URL:-https://download.geofabrik.de/north-america/us/missouri-latest.osm.pbf}
      PLANETILER_VERSION: ${PLANETILER_VERSION:-0.8.4}
    command:
      - sh
      - -c
      - >-
        apk add --no-cache curl >/dev/null &&
        curl -fL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v$${PLANETILER_VERSION}/planetiler.jar &&
        curl -fL -o region.osm.pbf "$${OSM_PBF_URL}" &&
        java -Xmx4g -jar planetiler.jar --osm-path=region.osm.pbf --download --output=/tiles/region.pmtiles --force
    volumes:
      - tiles:/tiles
      - tiles_work:/work
    restart: 'no'
    networks: [platform]

  # --- Monitoring (NFR-10, ADR-0023). Opt in with `docker compose --profile
  # monitoring up -d prometheus`: scrapes api and worker /metrics on the
  # platform network and evaluates infra/prometheus/alerts.yml. The UI is bound
  # to the laptop only. In the government cloud the provider's managed
  # Prometheus or OpenTelemetry collector takes its place with the same files.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    networks: [platform]

networks:
  platform:
    name: cg_platform

volumes:
  caddy_data:
  db_data:
  queue_data:
  objects_data:
  keys_data:
  keys_init:
  seed_data:
  tiles:
  tiles_work:
  geocoder_data:
  prometheus_data:
