# Scrape configuration (NFR-10, ADR-0023). Locally: `docker compose --profile
# monitoring up -d prometheus`, then http://127.0.0.1:9090 (bound to the
# laptop only). In the government cloud the provider's managed Prometheus or
# OpenTelemetry collector scrapes the same /metrics endpoints on the private
# network and loads the same rules file; nothing here leaves the platform
# network, and the gateway never routes /metrics.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:8080']
