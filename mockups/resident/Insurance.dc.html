<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insurance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4F91}a:hover{color:#123665}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1B1F23; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 6px; background: {{accent}}"></div>
<nav style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #D5DADF">
<a href="Question.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; font-size: 17px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</a>
<span style="font-size: 15px; color: #4A5560">About 3 questions left</span>
</nav>
<main style="flex-grow: 1; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700">Do you have insurance that may cover this damage?</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #2E353C">Choose all that fit. Your answer does not change whether you can get help from volunteers.</p>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
<label style="{{o.style}}">
<input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}" style="width: 24px; height: 24px; margin: 0; accent-color: {{accent}}; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px"><span>{{o.label}}</span><span style="font-size: 15px; font-weight: 400; color: #4A5560">{{o.hint}}</span></span>
</label>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<a href="Photo.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 20px; font-weight: 700; text-decoration: none">Continue</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D4F91","options":["#1D4F91","#0B6E4F","#5B3A8E","#7A4A00"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { renters: true } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#1D4F91';
    const base = [
      { id: 'home', label: 'Homeowners insurance', hint: 'Covers the building you own' },
      { id: 'renters', label: 'Renters insurance', hint: 'Covers your belongings' },
      { id: 'flood', label: 'Flood insurance', hint: 'A separate policy, often through FEMA’s program' },
      { id: 'none', label: 'No insurance', hint: '' },
      { id: 'unsure', label: 'I’m not sure', hint: '' }
    ];
    const picked = this.state.picked;
    const opts = base.map((o) => {
      const on = !!picked[o.id];
      return {
        ...o,
        on,
        toggle: () => this.setState({ picked: { ...picked, [o.id]: !on } }),
        style: 'display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;box-sizing:border-box;border-radius:8px;font-size:18px;font-weight:700;cursor:pointer;' +
          (on ? 'border:3px solid ' + accent + ';background:#EEF3FA;' : 'border:2px solid #8A949E;background:#FFFFFF;')
      };
    });
    return { accent, opts };
  }
}
</script>
</body>
</html>
