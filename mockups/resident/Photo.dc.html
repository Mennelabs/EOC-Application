<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo of your home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4F91}a:hover{color:#123665}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1B1F23; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 6px; background: {{accent}}"></div>
<nav style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #D5DADF">
<a href="Insurance.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; font-size: 17px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</a>
<span style="font-size: 15px; color: #4A5560">Photo 1 of 3 · optional</span>
</nav>
<main style="flex-grow: 1; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700">Take a photo of your whole home from outside</h1>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
<div style="height: 180px; border-radius: 8px; background: #E8EEF5; display: flex; align-items: center; justify-content: center; border: 2px solid #C3CDD8">
<svg width="230" height="150" viewBox="0 0 230 150" role="img" aria-label="Example: a house seen from the street, with the roof, walls and ground all inside the frame">
<rect x="6" y="6" width="218" height="138" fill="none" stroke="#1D4F91" stroke-width="2" stroke-dasharray="8 6"></rect>
<path d="M50 128V72l65-42 65 42v56z" fill="#FFFFFF" stroke="#1B1F23" stroke-width="3" stroke-linejoin="round"></path>
<path d="M38 80l77-52 77 52" fill="none" stroke="#1B1F23" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="100" y="92" width="30" height="36" fill="#C3CDD8" stroke="#1B1F23" stroke-width="2.5"></rect>
<rect x="64" y="84" width="24" height="20" fill="#C3CDD8" stroke="#1B1F23" stroke-width="2.5"></rect>
<rect x="142" y="84" width="24" height="20" fill="#C3CDD8" stroke="#1B1F23" stroke-width="2.5"></rect>
<path d="M150 46l18-10 4 14z" fill="#B3261E"></path>
<line x1="14" y1="128" x2="216" y2="128" stroke="#1B1F23" stroke-width="3"></line>
</svg>
</div>
<figcaption style="font-size: 15px; color: #4A5560">Example: roof, walls and ground all in the picture</figcaption>
</figure>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
<li style="display: flex; gap: 10px; align-items: flex-start; font-size: 17px; line-height: 1.4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5L20 7"></path></svg>Stand back so the whole home fits</li>
<li style="display: flex; gap: 10px; align-items: flex-start; font-size: 17px; line-height: 1.4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12l5 5L20 7"></path></svg>Daylight works best</li>
<li style="display: flex; gap: 10px; align-items: flex-start; font-size: 17px; line-height: 1.4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A4A00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17h.01"></path></svg><span><strong>Do not go inside or near damage if it is unsafe.</strong></span></li>
</ul>
<div style="flex-grow: 1"></div>
<button style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-family: inherit; font-size: 20px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Take photo</button>
<button style="display: flex; align-items: center; justify-content: center; min-height: 52px; border: 2px solid #1B1F23; border-radius: 8px; background: #FFFFFF; color: #1B1F23; font-family: inherit; font-size: 18px; font-weight: 700">Choose from my photos</button>
<a href="Review.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 17px; text-align: center">Skip photos — you can still send your report</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D4F91","options":["#1D4F91","#0B6E4F","#5B3A8E","#7A4A00"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1D4F91' };
  }
}
</script>
</body>
</html>
