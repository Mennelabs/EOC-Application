<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What was damaged</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4F91}a:hover{color:#123665}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1B1F23; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 6px; background: {{accent}}"></div>
<nav style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #D5DADF">
<a href="HomeType.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; font-size: 17px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</a>
<span style="font-size: 15px; color: #4A5560">About 6 questions left</span>
</nav>
<main style="flex-grow: 1; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<h1 style="margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700">What was damaged?</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #2E353C">Choose all that fit. This helps us send the right kind of help.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<button aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}" style="{{t.style}}">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="own-words" style="font-size: 17px; font-weight: 700">Or tell us in your own words</label>
<div style="display: flex; gap: 8px; align-items: stretch">
<textarea id="own-words" rows="2" placeholder="Example: a tree fell on the back bedroom and rain came in" style="flex-grow: 1; min-height: 56px; box-sizing: border-box; padding: 10px 12px; border: 2px solid #1B1F23; border-radius: 6px; font-family: inherit; font-size: 16px; resize: none"></textarea>
<button aria-label="Speak your answer instead of typing" style="width: 56px; border: 2px solid #1B1F23; border-radius: 6px; background: #FFFFFF; color: #1B1F23; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
</div>
</div>
<div style="flex-grow: 1"></div>
<a href="Insurance.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 20px; font-weight: 700; text-decoration: none">Continue</a>
<div style="display: flex; justify-content: center; gap: 28px">
<a href="Insurance.dc.html" style="display: flex; align-items: center; min-height: 44px; font-size: 17px">I don’t know</a>
<a href="Insurance.dc.html" style="display: flex; align-items: center; min-height: 44px; font-size: 17px">Skip</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D4F91","options":["#1D4F91","#0B6E4F","#5B3A8E","#7A4A00"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { roof: true, tree: true } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#1D4F91';
    const base = [
      { id: 'roof', label: 'Roof', icon: 'M3 11l9-7 9 7M5 10v10h14V10' },
      { id: 'windows', label: 'Windows or doors', icon: 'M4 3h16v18H4zM12 3v18M4 12h16' },
      { id: 'water', label: 'Water inside', icon: 'M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z' },
      { id: 'tree', label: 'Tree on home', icon: 'M12 21v-6M7 15h10l-5-11z' },
      { id: 'moved', label: 'Home moved or tilted', icon: 'M4 20h16M7 17l2-11 9 2-2 9z' },
      { id: 'power', label: 'Power or heat out', icon: 'M13 2L4 14h7l-1 8 9-12h-7z' }
    ];
    const picked = this.state.picked;
    const tiles = base.map((t) => {
      const on = !!picked[t.id];
      return {
        ...t,
        pressed: on ? 'true' : 'false',
        style: 'display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:92px;padding:12px;box-sizing:border-box;border-radius:8px;font-family:inherit;font-size:17px;font-weight:700;text-align:left;cursor:pointer;' +
          (on ? 'border:3px solid ' + accent + ';background:#EEF3FA;color:#1B1F23;' : 'border:2px solid #8A949E;background:#FFFFFF;color:#1B1F23;'),
        toggle: () => this.setState({ picked: { ...picked, [t.id]: !on } })
      };
    });
    return { accent, tiles };
  }
}
</script>
</body>
</html>
