<!doctype html>

<head>

<title>Safety check</title>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4F91}a:hover{color:#123665}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #1B1F23; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 6px; background: {{accent}}"></div>
<nav style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #D5DADF">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; font-size: 17px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</a>
<span style="font-size: 15px; color: #4A5560">First, your safety</span>
</nav>
<main style="flex-grow: 1; padding: 32px 20px 24px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-size: 30px; line-height: 1.2; font-weight: 700">Is anyone in danger right now?</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.5; color: #2E353C">For example: hurt, trapped, smelling gas, near a downed power line, or water rising inside.</p>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">Is anyone in danger right now?</legend>
<label style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 16px; border: 2px solid #1B1F23; border-radius: 8px; font-size: 20px; font-weight: 700">
<input type="radio" name="danger" style="width: 26px; height: 26px; margin: 0; accent-color: #B3261E">Yes, someone is in danger
</label>
<label style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 16px; border: 3px solid {{accent}}; border-radius: 8px; background: #EEF3FA; font-size: 20px; font-weight: 700">
<input type="radio" name="danger" checked style="width: 26px; height: 26px; margin: 0; accent-color: {{accent}}">No, everyone is safe
</label>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 8px; background: #FCEBEA; border: 2px solid #B3261E">
<div style="font-size: 17px; font-weight: 700; color: #5C1310">If you answer yes</div>
<div style="font-size: 17px; line-height: 1.45; color: #5C1310">We will show you who to call right away. Your answers so far are saved.</div>
</div>
<div style="flex-grow: 1"></div>
<a href="HomeType.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 20px; font-weight: 700; text-decoration: none">Continue</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D4F91","options":["#1D4F91","#0B6E4F","#5B3A8E","#7A4A00"]},"$preview":{"width":390,"height":844}}'>

    return { accent: this.props.accent ?? '#1D4F91' };
  }

</script>
</body>
</html>
